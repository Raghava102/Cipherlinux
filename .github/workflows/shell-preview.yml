# Renders the Cipher shell headlessly (Debian 13 + Quickshell + sway) and
# publishes screenshots and logs to the `ci-preview` branch.
name: Shell preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/**", "scripts/ci-shell-preview.sh"]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Render shell in a Debian 13 container
        run: |
          # a virtual KMS display so the real Hyprland session can run too
          sudo modprobe vkms || sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms || true
          ls -l /dev/dri || true
          sudo docker run --rm --privileged -v /dev:/dev -v "$PWD":/src -w /src debian:trixie bash scripts/ci-shell-preview.sh
          sudo chown -R "$(id -u):$(id -g)" preview

      - name: Hyprland config check
        if: always()
        run: |
          f=preview/verify-config.log
          [ -f "$f" ] || { echo "::warning::no verify-config.log"; exit 0; }
          cat "$f"
          if grep -qiE 'error|does not exist|invalid' "$f"; then
            grep -iE 'error|does not exist|invalid' "$f" | head -10 | while IFS= read -r l; do echo "::error title=hyprland config::${l:0:400}"; done
            exit 1
          fi
          echo "::notice title=hyprland config::OK"

      - name: Report shell errors
        if: always()
        run: |
          f=preview/shell.log
          [ -f "$f" ] || exit 0
          n=$(grep -ciE 'error|warn|failed|cannot|unable' "$f" || true)
          echo "::notice title=shell log::$n warning/error lines (see ci-preview branch)"
          grep -iE 'error|failed|cannot|unable' "$f" | head -8 | while IFS= read -r l; do
            echo "::warning title=shell::${l:0:400}"
          done

      - name: Publish to ci-preview branch
        if: always()
        run: |
          [ -d preview ] || exit 0
          SHA=$(git rev-parse --short HEAD)
          cd preview
          git init -q
          git config user.name "cipher-ci"
          git config user.email "cipher-ci@users.noreply.github.com"
          git checkout -q -b ci-preview
          echo "Shell preview for $SHA" > README.md
          git add -A
          git commit -q -m "Shell preview for $SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-preview
