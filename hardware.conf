# Generated by cipher-start at login — do not edit.
# Virtual machine detected: software cursors avoid an invisible pointer
cursor {
    no_hardware_cursors = 1
}
# performance: no blur or shadows (no real GPU)
decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
# follow the VM window size, at scale 1 (no stretching)
exec-once = /usr/lib/cipher/vm-display
