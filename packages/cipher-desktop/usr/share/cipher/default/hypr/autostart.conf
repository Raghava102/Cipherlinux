# Cipher session services. The shell (bar, menu, notifications, OSD, lock,
# background) is a single Quickshell process.
# apps started by D-Bus / systemd (Files, Software, Calendar, Terminal...) need the display;
# then (re)start the portals with it, so the first app doesn't wait for them
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE GDK_BACKEND QT_QPA_PLATFORM MOZ_ENABLE_WAYLAND XCURSOR_SIZE && systemctl --user restart xdg-desktop-portal-hyprland.service xdg-desktop-portal.service
exec-once = cipher-shell
exec-once = hypridle -c /usr/share/cipher/default/hypridle.conf
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = udiskie --automount --no-tray
# Lighter session: GNOME's file indexer (localsearch/tracker) scans the whole
# home folder in the background and makes small machines and VMs crawl.
# Stopped for this login only — the GNOME session still has it.
exec-once = systemctl --user mask --runtime --now localsearch-3.service tracker-miner-fs-3.service localsearch-control-3.service 2>/dev/null
