# Cipher — Hyprland defaults. Don't edit this file: it's replaced on update.
# Override anything in ~/.config/hypr/hyprland.conf (sourced after this).
# Written for Hyprland 0.54 (Debian 13 trixie-backports) config syntax.

source = /usr/share/cipher/default/hypr/envs.conf
source = /usr/share/cipher/default/hypr/looknfeel.conf
source = /usr/share/cipher/default/hypr/input.conf
source = /usr/share/cipher/default/hypr/bindings.conf
source = /usr/share/cipher/default/hypr/rules.conf
source = /usr/share/cipher/default/hypr/autostart.conf

# Generated by cipher-start / cipher-theme (hardware tweaks, theme colors)
source = ~/.config/cipher/current/hardware.conf
source = ~/.config/cipher/current/hyprland.conf
