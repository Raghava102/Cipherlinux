# Hyprland 0.53+ rule syntax (match: props + effects)

windowrule {
    # Ignore maximize requests from apps; tiling decides
    name = cipher-suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix XWayland drag-and-drop ghost windows
    name = cipher-fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    # Small utility windows float, centered
    name = cipher-float-utilities
    match:class = ^(org\.pulseaudio\.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor|org\.gnome\.Calculator|xdg-desktop-portal-gtk)$
    float = on
    center = on
    size = (monitor_w*0.5) (monitor_h*0.6)
}

windowrule {
    # Picture-in-picture stays put
    name = cipher-pip
    match:title = ^(Picture-in-Picture|Picture in picture)$
    float = on
    pin = on
}

# Blur behind the translucent parts of the Cipher shell
layerrule = blur on, match:namespace ^cipher-(bar|menu|themes|notifications|notification-center|osd)$
layerrule = ignore_alpha 0.25, match:namespace ^cipher-(bar|menu|themes|notifications|notification-center|osd)$
layerrule = no_anim on, match:namespace ^cipher-background$
