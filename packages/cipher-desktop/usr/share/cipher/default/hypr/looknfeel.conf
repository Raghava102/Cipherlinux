general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # colors come from the active theme (~/.config/cipher/current/hyprland.conf)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.15
        noise = 0.02
    }
}

# Snappy: everything 150-250 ms on a fast-out curve, no bounce, no long fades.
# Speeds are in deciseconds (2 = 200 ms).
animations {
    enabled = true

    bezier = snap, 0.20, 0.90, 0.10, 1.00
    bezier = out,  0.16, 1.00, 0.30, 1.00

    animation = windowsIn,   1, 2,   snap, popin 92%
    animation = windowsOut,  1, 2,   snap, popin 92%
    animation = windowsMove, 1, 2,   snap
    animation = fade,        1, 2,   out
    animation = border,      1, 3,   out
    animation = layers,      1, 2,   snap, fade
    animation = workspaces,  1, 2.5, snap, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    anr_missed_pings = 5
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
