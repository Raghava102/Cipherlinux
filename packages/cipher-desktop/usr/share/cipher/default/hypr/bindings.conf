# Cipher keybindings. Descriptions (bindd) feed the in-menu cheat sheet
# (SUPER + K). Override or unbind in ~/.config/hypr/hyprland.conf:
#   unbind = SUPER, RETURN
#   bindd  = SUPER, RETURN, Terminal, exec, kitty

$terminal = cipher-launch terminal
$browser  = cipher-launch browser
$files    = cipher-launch files

# --- Cipher shell -----------------------------------------------------------
bindd = SUPER, SPACE, Cipher menu, exec, cipher-ipc menu toggle
bindd = SUPER ALT, SPACE, App launcher, exec, cipher-ipc menu apps
bindd = SUPER SHIFT CTRL, SPACE, Theme switcher, exec, cipher-ipc themes toggle
bindd = SUPER CTRL, SPACE, Next background, exec, cipher-bg next
bindd = SUPER, ESCAPE, System menu, exec, cipher-ipc menu open System
bindd = SUPER CTRL, L, Lock screen, exec, cipher-lock
bindd = SUPER, C, Quick controls, exec, cipher-ipc controls toggle
bindd = SUPER, N, Notifications, exec, cipher-ipc notifications toggle
bindd = SUPER CTRL, N, Toggle do not disturb, exec, cipher-ipc notifications dnd
bindd = SUPER SHIFT, N, Dismiss notifications, exec, cipher-ipc notify dismissAll
bindd = SUPER, K, Keybindings, exec, cipher-ipc menu open Learn/Keybindings
bindd = SUPER CTRL, V, Clipboard history, exec, cipher-ipc menu open Tools/Clipboard
bindd = SUPER CTRL, E, Emoji picker, exec, cipher-ipc menu open Tools/Emoji

# --- Apps -------------------------------------------------------------------
bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER, E, File manager, exec, $files
bindd = SUPER SHIFT, T, System monitor, exec, cipher-launch terminal btop

# --- Windows ----------------------------------------------------------------
bindd = SUPER, W, Close window, killactive,
bindd = SUPER, F, Fullscreen, fullscreen, 0
bindd = SUPER ALT, F, Maximize, fullscreen, 1
bindd = SUPER, T, Toggle floating, togglefloating,
bindd = SUPER, J, Toggle split, layoutmsg, togglesplit
bindd = SUPER, O, Pin floating window, pin,

bindd = SUPER, LEFT, Focus left, movefocus, l
bindd = SUPER, RIGHT, Focus right, movefocus, r
bindd = SUPER, UP, Focus up, movefocus, u
bindd = SUPER, DOWN, Focus down, movefocus, d
bindd = SUPER SHIFT, LEFT, Swap left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Swap right, swapwindow, r
bindd = SUPER SHIFT, UP, Swap up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Swap down, swapwindow, d

binded = SUPER, MINUS, Shrink window, resizeactive, -60 0
binded = SUPER, EQUAL, Grow window, resizeactive, 60 0
binded = SUPER SHIFT, MINUS, Shrink window height, resizeactive, 0 -60
binded = SUPER SHIFT, EQUAL, Grow window height, resizeactive, 0 60

bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# --- Workspaces -------------------------------------------------------------
bindd = SUPER, 1, Workspace 1, workspace, 1
bindd = SUPER, 2, Workspace 2, workspace, 2
bindd = SUPER, 3, Workspace 3, workspace, 3
bindd = SUPER, 4, Workspace 4, workspace, 4
bindd = SUPER, 5, Workspace 5, workspace, 5
bindd = SUPER, 6, Workspace 6, workspace, 6
bindd = SUPER, 7, Workspace 7, workspace, 7
bindd = SUPER, 8, Workspace 8, workspace, 8
bindd = SUPER, 9, Workspace 9, workspace, 9
bindd = SUPER, 0, Workspace 10, workspace, 10

bindd = SUPER SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move to workspace 10, movetoworkspace, 10

bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER, S, Scratchpad, togglespecialworkspace, scratch
bindd = SUPER SHIFT, S, Move to scratchpad, movetoworkspace, special:scratch
bindd = SUPER, mouse_down, Next workspace, workspace, e+1
bindd = SUPER, mouse_up, Previous workspace, workspace, e-1

# --- Capture ----------------------------------------------------------------
bindd = , PRINT, Screenshot region, exec, cipher-screenshot region
bindd = SHIFT, PRINT, Screenshot screen, exec, cipher-screenshot screen
bindd = SUPER SHIFT, R, Record screen, exec, cipher-record toggle
bindd = SUPER SHIFT, C, Color picker, exec, cipher-colorpick

# --- Media & hardware keys (volume OSD appears automatically) ---------------
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = , XF86AudioMicMute, Mute microphone, exec, cipher-osd mic
bindeld = , XF86MonBrightnessUp, Brightness up, exec, cipher-osd brightness up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, cipher-osd brightness down
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Play or pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play or pause, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
