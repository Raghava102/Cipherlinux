# ~/.config/hypr/hyprland.conf — your Cipher Hyprland config.
#
# Cipher's defaults are loaded first; everything below overrides them.
# Hyprland reloads this file the moment you save it.
source = /usr/share/cipher/default/hypr/cipher.conf

# --- Monitors ----------------------------------------------------------------
# `hyprctl monitors` lists names. Examples:
# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, 2560x1440@144, auto, 1
monitor = , preferred, auto, auto

# --- Keyboard ----------------------------------------------------------------
# input {
#     kb_layout = us,in
#     kb_variant = ,eng
#     kb_options = grp:alt_shift_toggle,compose:caps
# }

# --- Your own keybindings ----------------------------------------------------
# unbind = SUPER, B
# bindd = SUPER, B, Browser, exec, firefox-esr

# --- Looks -------------------------------------------------------------------
# general { gaps_out = 6 }
# decoration { rounding = 0 }
