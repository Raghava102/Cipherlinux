# Cipher session (XDG_CURRENT_DESKTOP=Hyprland): which portal answers what.
# GTK handles app settings (dark mode, fonts), file pickers and "open with";
# Hyprland's portal only does what needs the compositor: screenshots, screen
# sharing and global shortcuts. The GNOME portal needs GNOME Shell, so it's
# never used here (apps waited on it and took 25+ s to open).
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.RemoteDesktop=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.InputCapture=hyprland
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Inhibit=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
